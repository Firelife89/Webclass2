<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Reading Library</title>
    <link rel="stylesheet" href="regstyless.css">

<body>

    <main>
        <section class="form-container">
            <h2>Global Reading Library</h2>
            <p>Join the Reading Community</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male" class="inline-label">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female" class="inline-label">Female</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Books</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="Science Hall" name="Books" value="Science Hall">
                        <label for="Science Hall" class="inline-label">Science Hall</label>
                        <input type="checkbox" id="Motivational Books" name="Books" value="Motivational Books">
                        <label for="Motivational Books" class="inline-label">Motivational Books</label>
                        <input type="checkbox" id="Biographies" name="Books" value="Biographies">
                        <label for="Biographies" class="inline-label">Biographies</label><br>
                        <input type="checkbox" id="Programming" name="Books" value="Programming">
                        <label for="Programming" class="inline-label">Programming</label>
                        <input type="checkbox" id="Leadership and influence" name="Books" value="Leadership and influence">
                        <label for="Leadership and influence" class="inline-label">Leadership and influence</label>
                                               <input type="checkbox" id="The Bible" name="Books" value="The Bible">
                        <label for="The Bible" class="inline-label">The Bible</label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>
